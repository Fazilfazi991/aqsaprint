<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | AQSA Print</title>
    <meta name="description" content="Thank you for contacting AQSA Print. Our team will respond soon.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1f2937 60%, #1A9A8A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .thank-you-panel {
            width: 100%;
            max-width: 620px;
            background: #fff;
            border-radius: 24px;
            padding: 48px;
            text-align: center;
            box-shadow: 0 24px 80px rgba(0,0,0,.24);
        }
        .thank-you-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-light);
            color: var(--teal-dark);
            font-size: 30px;
        }
        .thank-you-panel h1 {
            font-size: clamp(32px, 6vw, 48px);
            line-height: 1.1;
            color: var(--gray-900);
            margin-bottom: 16px;
        }
        .thank-you-panel p {
            color: var(--gray-600);
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 32px;
        }
        .thank-you-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }
        @media (max-width: 560px) {
            .thank-you-panel {
                padding: 36px 24px;
            }
            .thank-you-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="thank-you-panel">
        <div class="thank-you-icon"><i class="fas fa-check"></i></div>
        <h1>Thank You</h1>
        <p>Your message has been sent to AQSA Print. Our team will review your request and get back to you shortly.</p>
        <div class="thank-you-actions">
            <a href="index.html" class="btn btn-secondary">Back to Home</a>
            <a href="https://wa.me/966556683044" class="btn btn-primary"><i class="fab fa-whatsapp"></i> WhatsApp Us</a>
        </div>
    </main>
</body>
</html>
