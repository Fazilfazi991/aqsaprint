<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | AQSA Print Saudi Arabia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo">
                    <svg class="logo-icon" viewBox="0 0 48 48" fill="none">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#E8A5B8"/>
                                <stop offset="100%" style="stop-color:#2DB8A8"/>
                            </linearGradient>
                        </defs>
                        <circle cx="12" cy="24" r="10" fill="url(#logoGradient)" opacity="0.6"/>
                        <path d="M24 6L40 42H32L28 32H20L16 42H8L24 6Z" fill="url(#logoGradient)"/>
                    </svg>
                    <div><span class="logo-text text-gradient">AQSA</span></div>
                </a>
                <nav class="nav-desktop">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="services.html" class="nav-link">Services</a>
                    <a href="shop.html" class="nav-link">Products</a>
                    <a href="portfolio.html" class="nav-link">Portfolio</a>
                    <a href="about.html" class="nav-link">About</a>
                    <a href="contact.html" class="nav-link">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="lp-hero" style="min-height: 400px; padding: 120px 0 60px;">
        <div class="lp-hero-bg" style="background-image: url('https://images.unsplash.com/photo-1589149098258-3e9102ca63d3?w=1200&q=80')"></div>
        <div class="container">
            <div class="lp-hero-content" style="max-width: 800px; margin: 0 auto; text-align: center;">
                <h1 class="text-white">Get Your Free Quote Today</h1>
                <p class="text-white">Tell us about your project and we'll respond within 24 hours.</p>
            </div>
        </div>
    </section>

    <section class="lp-intro" style="background: var(--gray-50);">
        <div class="container">
            <div class="quote-form-container" style="max-width: 900px; margin: -100px auto 0; position: relative; z-index: 10;">
                <form action="#" method="POST" style="background: white; padding: 48px; border-radius: 24px; box-shadow: var(--shadow-xl);">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Name (Required)</label>
                            <input type="text" required style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Email (Required)</label>
                            <input type="email" required style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Phone (Required)</label>
                            <input type="tel" required style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Company</label>
                            <input type="text" style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Service Type</label>
                        <select style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                            <option>Indoor & Outdoor Branding</option>
                            <option>Vehicle Branding</option>
                            <option>Signages</option>
                            <option>Design & Development</option>
                            <option>Rollups & Backdrops</option>
                            <option>Flags</option>
                            <option>Promotional Gifts</option>
                            <option>Printing Services</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; font-weight: 600; margin-bottom: 8px;">Project Details</label>
                        <textarea style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px; height: 120px;" placeholder="Tell us about your project..."></textarea>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px;">
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Quantity/Dimensions</label>
                            <input type="text" style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Timeline</label>
                            <input type="text" style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px;">
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">Budget Range</label>
                            <input type="text" style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                        <div>
                            <label style="display: block; font-weight: 600; margin-bottom: 8px;">File Upload</label>
                            <input type="file" style="width: 100%; padding: 14px; border: 1px solid var(--gray-200); border-radius: 12px;">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 18px;">Get My Free Quote</button>
                    <p style="text-align: center; margin-top: 24px; color: var(--gray-500); font-size: 14px;">No obligation quote. Your information is secure.</p>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>© 2025 AQSA Print. Riyadh, KSA.</p>
        </div>
    </footer>
</body>
</html>
