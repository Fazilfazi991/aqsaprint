<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AQSA Print Saudi Arabia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-inner">
                <a href="index.html" class="logo">
                    <svg class="logo-icon" viewBox="0 0 48 48" fill="none">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#E8A5B8"/>
                                <stop offset="100%" style="stop-color:#2DB8A8"/>
                            </linearGradient>
                        </defs>
                        <circle cx="12" cy="24" r="10" fill="url(#logoGradient)" opacity="0.6"/>
                        <path d="M24 6L40 42H32L28 32H20L16 42H8L24 6Z" fill="url(#logoGradient)"/>
                    </svg>
                    <div><span class="logo-text text-gradient">AQSA</span></div>
                </a>
                <nav class="nav-desktop">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="services.html" class="nav-link">Services</a>
                    <a href="shop.html" class="nav-link">Products</a>
                    <a href="portfolio.html" class="nav-link">Portfolio</a>
                    <a href="about.html" class="nav-link">About</a>
                    <a href="contact.html" class="nav-link active">Contact</a>
                </nav>
            </div>
        </div>
    </header>

    <section class="lp-hero">
        <div class="lp-hero-bg" style="background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200&q=80')"></div>
        <div class="container">
            <div class="lp-hero-content">
                <h1 class="text-white">Contact Us</h1>
                <h2 class="text-white">Let's discuss your project and bring your brand to life.</h2>
            </div>
        </div>
    </section>

    <section class="lp-intro">
        <div class="container">
            <div class="contact-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 40px;">
                <div class="contact-info">
                    <h2 class="section-title">Get In Touch</h2>
                    <p style="margin-bottom: 24px;">Our team is ready to help you with any inquiries.</p>
                    <div style="margin-bottom: 16px;"><i class="fas fa-phone" style="color: var(--teal-primary); margin-right: 12px;"></i> +966 55 668 3044</div>
                    <div style="margin-bottom: 16px;"><i class="fab fa-whatsapp" style="color: var(--teal-primary); margin-right: 12px;"></i> +966 55 668 3044</div>
                    <div style="margin-bottom: 16px;"><i class="fas fa-envelope" style="color: var(--teal-primary); margin-right: 12px;"></i> info@aqsaprint.com</div>
                    <div style="margin-bottom: 16px;"><i class="fas fa-map-marker-alt" style="color: var(--teal-primary); margin-right: 12px;"></i> Riyadh, Saudi Arabia</div>
                </div>
                <div class="contact-form">
                    <form action="#" method="POST" style="background: white; padding: 32px; border-radius: 16px; box-shadow: var(--shadow-lg);">
                        <div style="margin-bottom: 16px;">
                            <label>Name</label>
                            <input type="text" placeholder="Your Name" style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--gray-200); border-radius: 8px;">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label>Email</label>
                            <input type="email" placeholder="Your Email" style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--gray-200); border-radius: 8px;">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label>Message</label>
                            <textarea placeholder="Your Message" style="width: 100%; padding: 12px; margin-top: 8px; border: 1px solid var(--gray-200); border-radius: 8px; height: 120px;"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>© 2025 AQSA Print. Riyadh, KSA.</p>
        </div>
    </footer>
</body>
</html>
